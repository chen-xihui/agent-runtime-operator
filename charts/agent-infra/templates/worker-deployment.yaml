{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-infra.workerName" . }}
  namespace: {{ include "agent-infra.namespace" . }}
  labels:
    app.kubernetes.io/component: worker
    {{- include "agent-infra.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
        {{- include "agent-infra.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "agent-infra.operatorName" . }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.worker.temporalAddress | quote }}
            - name: NATS_URL
              value: {{ .Values.worker.natsURL | quote }}
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
{{- end }}
