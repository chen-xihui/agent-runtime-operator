{{- if .Values.temporal.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-infra.temporalName" . }}
  namespace: {{ include "agent-infra.namespace" . }}
  labels:
    app.kubernetes.io/component: temporal
    {{- include "agent-infra.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/component: temporal
        {{- include "agent-infra.labels" . | nindent 8 }}
    spec:
      containers:
        - name: temporal
          image: "{{ .Values.temporal.image.repository }}:{{ .Values.temporal.image.tag }}"
          env:
            - name: DB
              value: "postgres12_pgx"
            {{- if .Values.temporal.enablePostgres }}
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ include "agent-infra.postgresName" . }}, key: user } }
            - name: POSTGRES_PWD
              valueFrom: { secretKeyRef: { name: {{ include "agent-infra.postgresName" . }}, key: password } }
            - name: POSTGRES_SEEDS
              value: {{ include "agent-infra.postgresName" . }}
            {{- end }}
          ports:
            - name: frontend
              containerPort: 7233
            - name: matching
              containerPort: 7234
            - name: history
              containerPort: 7235
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1000m, memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-infra.temporalName" . }}
  namespace: {{ include "agent-infra.namespace" . }}
  labels:
    app.kubernetes.io/component: temporal
    {{- include "agent-infra.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: temporal
  ports:
    - name: frontend
      port: 7233
      targetPort: frontend
    - name: matching
      port: 7234
      targetPort: matching
    - name: history
      port: 7235
      targetPort: history
{{- end }}
