{{- if .Values.nats.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-infra.natsName" . }}
  namespace: {{ include "agent-infra.namespace" . }}
  labels:
    app.kubernetes.io/component: nats
    {{- include "agent-infra.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/component: nats
        {{- include "agent-infra.labels" . | nindent 8 }}
    spec:
      containers:
        - name: nats
          image: "{{ .Values.nats.image.repository }}:{{ .Values.nats.image.tag }}"
          args:
            {{- if .Values.nats.jetstream }}
            - -js
            {{- end }}
            - -m
            - "8222"
          ports:
            - name: client
              containerPort: 4222
            - name: monitoring
              containerPort: 8222
          resources:
            requests: {{ toYaml .Values.nats.resources.requests | nindent 14 }}
            limits: {{ toYaml .Values.nats.resources.limits | nindent 14 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-infra.natsName" . }}
  namespace: {{ include "agent-infra.namespace" . }}
  labels:
    app.kubernetes.io/component: nats
    {{- include "agent-infra.labels" . | nindent 4 }}
spec:
  type: {{ .Values.nats.serviceType }}
  selector:
    app.kubernetes.io/component: nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitoring
      port: 8222
      targetPort: monitoring
{{- end }}
