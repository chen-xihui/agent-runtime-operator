# 汇总部署配置：`kubectl apply -k config/default`
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agent-runtime-system

resources:
  - ../manager/namespace.yaml
  - ../manager/manager.yaml
  - ../rbac/role.yaml
  - ../rbac/service_account.yaml
  - ../crd

commonLabels:
  app.kubernetes.io/part-of: agent-runtime-operator
