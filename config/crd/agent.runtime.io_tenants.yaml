---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.agent.runtime.io
spec:
  group: agent.runtime.io
  names:
    kind: Tenant
    listKind: TenantList
    plural: tenants
    singular: tenant
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: Tenant 是租户资源
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: TenantSpec 租户定义
              type: object
              properties:
                quota:
                  description: QuotaSpec 资源配额
                  type: object
                  properties:
                    maxSandboxes:
                      type: integer
                    maxAgents:
                      type: integer
                    maxCpu:
                      type: string
                    maxMemory:
                      type: string
                networkPolicy:
                  type: string
                labels:
                  type: object
                  additionalProperties:
                    type: string
            status:
              description: TenantStatus 租户实际状态
              type: object
              properties:
                phase:
                  type: string
                namespace:
                  type: string
                sandboxCount:
                  type: integer
                agentCount:
                  type: integer
