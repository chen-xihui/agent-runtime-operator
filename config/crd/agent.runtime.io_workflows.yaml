---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workflows.agent.runtime.io
spec:
  group: agent.runtime.io
  names:
    kind: Workflow
    listKind: WorkflowList
    plural: workflows
    singular: workflow
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: Workflow 是编排 DSL 资源
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: WorkflowSpec 编排 DSL 定义
              type: object
              required:
                - entrypoint
                - nodes
              properties:
                entrypoint:
                  type: string
                events:
                  type: array
                  items:
                    type: object
                    properties:
                      on:
                        type: string
                      from:
                        type: string
                nodes:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - agent
                      - action
                    properties:
                      id:
                        type: string
                      agent:
                        type: string
                      action:
                        type: string
                      dependsOn:
                        type: array
                        items:
                          type: string
                      retry:
                        type: object
                        properties:
                          max:
                            type: integer
                          backoff:
                            type: string
                          interval:
                            type: string
                      condition:
                        type: string
                      always:
                        type: boolean
                      timeout:
                        type: string
                      kind:
                        type: string
