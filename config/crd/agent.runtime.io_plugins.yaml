---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: plugins.agent.runtime.io
spec:
  group: agent.runtime.io
  names:
    kind: Plugin
    listKind: PluginList
    plural: plugins
    singular: plugin
    shortNames:
      - plug
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: Plugin 是插件市场资源（M5）
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: PluginSpec 插件定义
              type: object
              required:
                - version
                - type
              properties:
                version:
                  type: string
                type:
                  type: string
                description:
                  type: string
                author:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                requiresAgents:
                  type: array
                  items:
                    type: string
                enabled:
                  type: boolean
            status:
              description: PluginStatus 插件实际状态
              type: object
              properties:
                state:
                  type: string
                installedVersion:
                  type: string
                message:
                  type: string
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: State
          type: string
          jsonPath: .status.state
