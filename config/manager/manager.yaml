# Operator Deployment —— 控制面核心（design-doc 9.1 控制面/数据面分离）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime-operator
  namespace: agent-runtime-system
  labels:
    control-plane: agent-runtime-operator
spec:
  # M5 高可用：多副本 + LeaderElection（仅 leader 调谐，其余 standby）
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      control-plane: agent-runtime-operator
  template:
    metadata:
      labels:
        control-plane: agent-runtime-operator
    spec:
      serviceAccountName: agent-runtime-operator
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    control-plane: agent-runtime-operator
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: registry.internal/agent-runtime/operator:latest
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            # M3 编排：Temporal 地址（不设则 WorkflowRun 控制器不注册，编排功能关闭）
            - --temporal-address=agent-infra-temporal.agent-runtime-system.svc.cluster.local:7233
            # M2/M3 事件总线：NATS 地址（不设则事件驱动推进不生效）
            - --nats-url=nats://agent-infra-nats.agent-runtime-system.svc.cluster.local:4222
            # 事件持久化（关键控制事件落盘，可经 replay-events 回放）
            - --enable-jetstream
            - --jetstream-stream=agent-events
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
