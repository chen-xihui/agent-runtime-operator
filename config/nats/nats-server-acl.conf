# agent-runtime 事件总线 NATS Server 配置（R-3 租户隔离）
# 由 internal/eventbus/acl.go 的 BuildACLConfig/RenderACL 生成本结构。
# operator/worker 用 operator 账号（全权限）；每租户 Relay 用 tenant-<t> 账号（仅本租户 subject）。
# 部署方式：
#   docker run -p 4222:4222 -v $PWD:/conf nats:2.10 -js -c /conf/nats-server-acl.conf
port: 4222
http: 8222
jetstream { store_dir: /tmp/nats-js }

authorization {
  # 多租户账号：operator 全权限，tenant-a/tenant-b 仅限本租户事件 subject
  users = [
    # --- 平台控制面（operator/worker）：全权限 ---
    { user: "operator", password: "op-secret", permissions: { publish: [">"], subscribe: [">"] } },
    # --- 租户 tenant-a Relay：仅 agent-runtime.tenant-a.events.> ---
    { user: "tenant-a", password: "a-secret", permissions: {
      publish: ["agent-runtime.tenant-a.events.>", "_INBOX.>", "$JS.API.>"],
      subscribe: ["agent-runtime.tenant-a.events.>", "_INBOX.>", "$JS.API.>", "$JS.ACK.>"]
    } },
    # --- 租户 tenant-b Relay：仅 agent-runtime.tenant-b.events.> ---
    { user: "tenant-b", password: "b-secret", permissions: {
      publish: ["agent-runtime.tenant-b.events.>", "_INBOX.>", "$JS.API.>"],
      subscribe: ["agent-runtime.tenant-b.events.>", "_INBOX.>", "$JS.API.>", "$JS.ACK.>"]
    } }
  ]
}
